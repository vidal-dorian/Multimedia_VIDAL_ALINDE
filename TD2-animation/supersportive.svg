<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="62 95 1120 315" width="1120" height="315">
  <title>Supersportive</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="0.25" stop-color="#e0161f"/>
      <stop offset="0.65" stop-color="#9a0913"/>
      <stop offset="1" stop-color="#3f0207"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7488a2"/>
      <stop offset="0.45" stop-color="#1c2636"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="spokeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d858f"/>
      <stop offset="0.5" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#7d858f"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a3e45"/>
      <stop offset="0.6" stop-color="#6b717a"/>
      <stop offset="1" stop-color="#4a4f57"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="carbon" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#15171b"/>
      <path d="M0 0h3v3H0zM3 3h3v3H3z" fill="#24272d"/>
    </pattern>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <g id="wheel">
      <circle r="62" fill="#0e0e10"/>
      <circle r="57" fill="none" stroke="#26272b" stroke-width="3"/>
      <circle r="47" fill="#17191d"/>
      <circle r="39" fill="url(#disc)"/>
      <circle r="31" fill="none" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="2 5"/>
      <path d="M 18,-37 A 41 41 0 0 1 39,-13 L 30,-10 A 32 32 0 0 0 14,-28 Z" fill="#f2c200"/>
      <g fill="url(#spokeGrad)" stroke="#5d646d" stroke-width="0.8">
        <g id="spokePair">
          <path d="M -5,-9 L -9,-45 L -3,-45 L -1,-9 Z"/>
          <path d="M 1,-9 L 3,-45 L 9,-45 L 5,-9 Z"/>
        </g>
        <use href="#spokePair" xlink:href="#spokePair" transform="rotate(72)"/>
        <use href="#spokePair" xlink:href="#spokePair" transform="rotate(144)"/>
        <use href="#spokePair" xlink:href="#spokePair" transform="rotate(216)"/>
        <use href="#spokePair" xlink:href="#spokePair" transform="rotate(288)"/>
      </g>
      <circle r="46" fill="none" stroke="#c4cad2" stroke-width="2.5"/>
      <circle r="12" fill="#d9dee4" stroke="#6a7079" stroke-width="1"/>
      <circle r="5" fill="#2b2e33"/>
    </g>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="625" cy="384" rx="580" ry="14" fill="url(#shadow)"/>

  <!-- Fond des passages de roue -->
  <path d="M 375,355 A 92 92 0 1 0 225,355 Z" fill="#08080a"/>
  <path d="M 1005,355 A 92 92 0 1 0 855,355 Z" fill="#08080a"/>

  <!-- Montants d'aileron (derrière la carrosserie) -->
  <path d="M 150,164 L 142,120 L 151,120 L 160,163 Z" fill="#111"/>
  <path d="M 205,160 L 197,116 L 206,116 L 215,159 Z" fill="#111"/>

  <!-- Carrosserie -->
  <path d="M 96,330
           L 88,200
           C 88,178 98,166 120,162
           L 260,154
           C 330,150 410,135 480,126
           C 540,119 600,118 650,120
           C 720,124 770,150 820,182
           C 880,190 980,196 1080,222
           C 1130,236 1160,252 1162,272
           L 1158,300
           L 1150,345
           L 1005,355
           A 92 92 0 1 0 855,355
           L 375,355
           A 92 92 0 1 0 225,355
           L 120,350
           Z"
        fill="url(#body)" stroke="#2a0104" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Reflets d'épaule -->
  <path d="M 265,158 C 360,150 420,138 500,126" fill="none" stroke="url(#sheen)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 860,190 C 940,196 1010,206 1090,226" fill="none" stroke="url(#sheen)" stroke-width="3" stroke-linecap="round"/>

  <!-- Ligne de caractère -->
  <path d="M 1000,238 C 860,226 720,228 620,236" fill="none" stroke="#ff9a90" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Prise d'air latérale -->
  <path d="M 606,228 C 530,226 460,242 402,290 L 468,294 C 510,264 560,250 612,244 Z" fill="#0f0205"/>
  <path d="M 468,294 C 510,264 560,250 612,244" fill="none" stroke="#ff6b60" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Bas de caisse carbone -->
  <path d="M 378,355 L 852,355 L 845,336 C 700,331 520,332 385,339 Z" fill="url(#carbon)" stroke="#000" stroke-width="1"/>

  <!-- Ligne de porte -->
  <path d="M 812,188 C 822,240 812,300 786,342" fill="none" stroke="#4a0207" stroke-width="1.5"/>

  <!-- Persiennes capot moteur -->
  <g stroke="#2b0104" stroke-width="3" stroke-linecap="round">
    <path d="M 318,162 L 348,154"/>
    <path d="M 346,158 L 376,149"/>
    <path d="M 374,153 L 404,143"/>
    <path d="M 402,147 L 432,137"/>
  </g>

  <!-- Vitrage -->
  <path d="M 488,136 C 545,127 600,126 648,128 C 712,132 762,156 806,181 L 712,186 C 630,184 555,170 488,148 Z" fill="url(#glass)" stroke="#05070b" stroke-width="2"/>
  <path d="M 535,138 L 625,131 L 608,142 L 525,148 Z" fill="#fff" fill-opacity="0.18"/>
  <path d="M 690,138 L 735,150 L 722,156 L 682,146 Z" fill="#fff" fill-opacity="0.14"/>

  <!-- Rétroviseur -->
  <path d="M 812,186 L 806,176" stroke="#1a0103" stroke-width="3"/>
  <path d="M 792,176 C 800,164 826,164 834,172 L 827,181 C 814,181 804,181 794,183 Z" fill="url(#body)" stroke="#2a0104" stroke-width="1"/>

  <!-- Feux avant -->
  <path d="M 1040,226 L 1140,244 L 1134,252 L 1036,234 Z" fill="#9fdcff" filter="url(#glow)" opacity="0.9"/>
  <path d="M 1040,226 L 1140,244 L 1134,252 L 1036,234 Z" fill="#f2fbff"/>

  <!-- Entrée d'air avant -->
  <path d="M 1088,290 L 1150,296 L 1148,308 L 1093,306 Z" fill="#0b0b0d"/>

  <!-- Lame avant -->
  <path d="M 1010,352 L 1150,345 L 1164,350 L 1012,360 Z" fill="url(#carbon)" stroke="#000" stroke-width="1"/>

  <!-- Feux arrière -->
  <path d="M 89,184 L 130,172 L 190,163 L 191,169 L 131,179 L 90,193 Z" fill="#ff1a1a" filter="url(#glow)" opacity="0.9"/>
  <path d="M 89,184 L 130,172 L 190,163 L 191,169 L 131,179 L 90,193 Z" fill="#ff4d4d"/>

  <!-- Diffuseur -->
  <path d="M 94,318 L 224,338 L 225,355 L 120,350 L 96,330 Z" fill="url(#carbon)" stroke="#000" stroke-width="1"/>
  <g stroke="#3a3d43" stroke-width="2">
    <path d="M 130,324 L 132,350"/>
    <path d="M 160,328 L 162,352"/>
    <path d="M 190,333 L 192,353"/>
  </g>

  <!-- Lame d'aileron -->
  <path d="M 84,122 C 130,111 200,107 250,109 L 248,118 C 200,117 130,122 86,131 Z" fill="url(#carbon)" stroke="#000" stroke-width="1.2"/>
  <path d="M 82,112 L 91,112 L 93,138 L 84,138 Z" fill="#111"/>

  <!-- Roues -->
  <use href="#wheel" xlink:href="#wheel" transform="translate(300,302) scale(1.29)"/>
  <use href="#wheel" xlink:href="#wheel" transform="translate(930,302) scale(1.29)"/>
</svg>
